<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WQT Academy – Price Action Schritt für Schritt verstehen und anwenden."
    />
    <meta name="theme-color" content="#0d1728" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WQT Academy" />
    <title>WQT Academy – Price Action</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen); Logik wie src/features/theme.ts.
      (function () {
        var theme = 'light';
        try {
          var stored = JSON.parse(localStorage.getItem('wqt-academy-ui-v1') || '{}').theme;
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === 'auto' && dark)) theme = 'dark';
        } catch (error) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
