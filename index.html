   DRILL 1 — Bar-Typ erkennen (Trend-Bull / Trend-Bear / Doji)
   ============================================================ */
const BAR_DECK = [
  { o:20, h:22, l:19.6, c:21.6, type:'bull' },
  { o:22, h:22.3, l:18.5, c:19, type:'bear' },
  { o:20, h:20.4, l:19.6, c:20.1, type:'doji' },
  { o:19, h:22.5, l:18.9, c:22.2, type:'bull' },
  { o:21, h:21.5, l:17.8, c:18.1, type:'bear' },
  { o:20.5, h:21.8, l:19.1, c:20.6, type:'doji' },
  { o:18.5, h:21.6, l:18.4, c:21.4, type:'bull' },
  { o:23, h:23.2, l:19.4, c:19.6, type:'bear' },
  { o:20, h:20.9, l:19.0, c:20.05, type:'doji' },
  { o:19.6, h:20.0, l:16.9, c:17.2, type:'bear' }
];
let barDrillOrder = [], barDrillIdx = 0, barDrillScore = 0, barDrillAnswered = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showBarDrill(){
  currentView = 'drill'; markActive(null, 'bar');
  closeSidebarMobile();
  barDrillOrder = shuffle([...Array(BAR_DECK.length).keys()]);
  barDrillIdx = 0; barDrillScore = 0;
  renderBarDrillFrame();
}

function renderBarDrillFrame(){
  const content = document.getElementById('content');
  let html = '<div class="crumb">Übung</div><div class="page-title">🕯️ Bar-Typ erkennen</div>';
  html += '<div class="lead">Ist der markierte Bar ein Bull-Trend-Bar, ein Bear-Trend-Bar, oder ein Doji (kaum Körper, keine Seite hat die Kontrolle)?</div>';
  html += '<div class="drill-box">';
  html += '<div class="drill-hud"><span>Bar <b id="bar-drill-n">1</b> / ' + BAR_DECK.length + '</span><span>Richtig: <b id="bar-drill-score">0</b></span></div>';
  html += '<div class="drill-chart-wrap" id="bar-drill-chart"></div>';
  html += '<div class="drill-answers">' +
    '<button class="drill-btn pill-bull" onclick="answerBarDrill(\'bull\')">📈 Bull-Trend-Bar</button>' +
    '<button class="drill-btn pill-bear" onclick="answerBarDrill(\'bear\')">📉 Bear-Trend-Bar</button>' +
    '<button class="drill-btn" onclick="answerBarDrill(\'doji\')">➖ Doji</button>' +
  '</div>';
  html += '<div class="drill-feedback" id="bar-drill-feedback"></div>';
  html += '<button class="drill-next" id="bar-drill-next" style="display:none" onclick="nextBarDrill()">Weiter →</button>';
  html += '</div>';
  content.innerHTML = html;
  window.scrollTo(0,0);
  drawCurrentBar();
}

function drawCurrentBar(){
  barDrillAnswered = false;
  document.getElementById('bar-drill-n').textContent = (barDrillIdx + 1);
  document.getElementById('bar-drill-score').textContent = barDrillScore;
  document.getElementById('bar-drill-feedback').textContent = '';
  document.getElementById('bar-drill-feedback').className = 'drill-feedback';
  document.getElementById('bar-drill-next').style.display = 'none';
  const bar = BAR_DECK[barDrillOrder[barDrillIdx]];
  const isBull = bar.c >= bar.o;
  const yScale = v => 140 - (v - 16) * 22;
  const bodyTop = yScale(Math.max(bar.o, bar.c));
  const bodyBot = yScale(Math.min(bar.o, bar.c));
  const bodyH = Math.max(bodyBot - bodyTop, 2);
  const color = isBull ? 'var(--good)' : 'var(--bad)';
  const svg = '<svg viewBox="0 0 160 160" width="160" height="160" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="80" y1="' + yScale(bar.h) + '" x2="80" y2="' + yScale(bar.l) + '" stroke="' + color + '" stroke-width="2.5"/>' +
    '<rect x="55" y="' + bodyTop + '" width="50" height="' + bodyH + '" fill="' + color + '" rx="2"/>' +
    '</svg>';
  document.getElementById('bar-drill-chart').innerHTML = svg;
}

function answerBarDrill(choice){
  if (barDrillAnswered) return;
  barDrillAnswered = true;
  const bar = BAR_DECK[barDrillOrder[barDrillIdx]];
  const fb = document.getElementById('bar-drill-feedback');
  if (choice === bar.type){
    barDrillScore++;
    fb.textContent = '✓ Richtig!';
    fb.className = 'drill-feedback ok';
  } else {
    const label = { bull:'Bull-Trend-Bar', bear:'Bear-Trend-Bar', doji:'Doji' }[bar.type];
    fb.textContent = '✗ Leider nicht — das war ein ' + label + '.';
    fb.className = 'drill-feedback bad';
  }
  document.getElementById('bar-drill-score').textContent = barDrillScore;
  document.getElementById('bar-drill-next').style.display = 'inline-block';
}

function nextBarDrill(){
  barDrillIdx++;
  if (barDrillIdx >= BAR_DECK.length){
    const content = document.getElementById('content');
    content.innerHTML = '<div class="crumb">Übung</div><div class="page-title">🕯️ Bar-Typ erkennen</div>' +
      '<div class="drill-box"><h3 style="color:var(--accent);font-family:Georgia,serif;">Runde geschafft 🎉</h3>' +
      '<p>Du hattest ' + barDrillScore + ' von ' + BAR_DECK.length + ' richtig.</p>' +
      '<button class="drill-btn" onclick="showBarDrill()">Nochmal (neu gemischt)</button></div>';
    return;
  }
  drawCurrentBar();
}

function answerLegDrill(pointIdx){

}

/* ============================================================
   DRILL 4 — Schnell-Drill: Trend oder Range?
   ============================================================ */
let trStreak = 0, trBest = 0, trAttempts = 0, trCorrect = 0, trCurrentIsTrend = false, trAnswered = false;

function loadTrBest(){
  try { return parseInt(localStorage.getItem('brooks-tr-best') || '0'); } catch(e){ return 0; }
}
function saveTrBest(v){
  try { localStorage.setItem('brooks-tr-best', String(v)); } catch(e){}
}

function genMiniSeries(isTrend){
  const n = 14;
  const pts = [];
  let y = 70;
  const drift = isTrend ? (Math.random() < 0.5 ? -3.2 : 3.2) : 0;
  for (let i = 0; i < n; i++){
    const noise = (Math.random() - 0.5) * (isTrend ? 6 : 13);
    y += drift + noise;
    y = Math.max(14, Math.min(126, y));
    pts.push([20 + i * (240/(n-1)), y]);
  }
  return pts;
}

function showTrendRangeDrill(){
  currentView = 'drill'; markActive(null, 'tr');
  closeSidebarMobile();
  trStreak = 0; trAttempts = 0; trCorrect = 0; trBest = loadTrBest();
  renderTrFrame();
}

function renderTrFrame(){
  const content = document.getElementById('content');
  let html = '<div class="crumb">Übung</div><div class="page-title">⚡ Schnell-Drill: Trend oder Range?</div>';
  html += '<div class="lead">Kurzer Blick genügt — ist dieser Kursverlauf ein Trend oder eine Trading Range? So trifft man die Grundfrage jedes Charts schneller.</div>';
  html += '<div class="drill-box">';
  html += '<div class="drill-hud"><span>Serie: <b id="tr-streak">0</b></span><span>Bestwert: <b id="tr-best">' + trBest + '</b></span><span>Treffer: <b id="tr-score">0</b> / <b id="tr-total">0</b></span></div>';
  html += '<div class="drill-chart-wrap" id="tr-chart"></div>';
  html += '<div class="drill-answers">' +
    '<button class="drill-btn" onclick="answerTrDrill(true)">📈 Trend</button>' +
    '<button class="drill-btn" onclick="answerTrDrill(false)">↔️ Range</button>' +
  '</div>';
  html += '<div class="drill-feedback" id="tr-feedback"></div>';
  html += '<button class="drill-next" id="tr-next" style="display:none" onclick="nextTrRound()">Nächste Runde →</button>';
  html += '</div>';
  content.innerHTML = html;
  window.scrollTo(0,0);
  drawTrChart();
}

function drawTrChart(){
  trAnswered = false;
  trCurrentIsTrend = Math.random() < 0.5;
  const pts = genMiniSeries(trCurrentIsTrend);
  const poly = pts.map(p => p[0] + ',' + p[1].toFixed(1)).join(' ');
  const svg = '<svg viewBox="0 0 280 140" width="100%" style="max-width:420px" xmlns="http://www.w3.org/2000/svg">' +
    '<polyline points="' + poly + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>' +
    '</svg>';
  document.getElementById('tr-chart').innerHTML = svg;
  document.getElementById('tr-feedback').textContent = '';
  document.getElementById('tr-feedback').className = 'drill-feedback';
  document.getElementById('tr-next').style.display = 'none';
}

function answerTrDrill(guessTrend){
  if (trAnswered) return;
  trAnswered = true;
  trAttempts++;
  const fb = document.getElementById('tr-feedback');
  if (guessTrend === trCurrentIsTrend){
    trCorrect++; trStreak++;
    if (trStreak > trBest){ trBest = trStreak; saveTrBest(trBest); }
    fb.textContent = '✓ Richtig! Streak: ' + trStreak;
    fb.className = 'drill-feedback ok';
  } else {
    trStreak = 0;
    fb.textContent = '✗ Das war eigentlich ' + (trCurrentIsTrend ? 'ein Trend' : 'eine Range') + '.';
    fb.className = 'drill-feedback bad';
  }
  document.getElementById('tr-streak').textContent = trStreak;
  document.getElementById('tr-best').textContent = trBest;
  document.getElementById('tr-score').textContent = trCorrect;
  document.getElementById('tr-total').textContent = trAttempts;
  document.getElementById('tr-next').style.display = 'inline-block';
}

function nextTrRound(){
  drawTrChart();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open-mobile');
}
function closeSidebarMobile(){
  if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open-mobile');
}

/* init */
renderNav();
openChapter('b1-intro');
</script>
