<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Action Lernpfad — Al Brooks</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1c2530; --ink-soft:#586472;
    --accent:#1b3a52; --accent-2:#2c5270; --accent-soft:#e7eef3;
    --line:#dfe6ec; --good:#0d7a3c; --bad:#b3261e; --warn-bg:#fff8ea; --warn-line:#f0dfa8; --warn-ink:#5c4a13;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161c; --panel:#171d25; --ink:#e7edf2; --ink-soft:#9fb0bd;
      --accent:#5fa3c9; --accent-2:#3f6f8e; --accent-soft:#1d2b35;
      --line:#2a333d; --good:#4ad17f; --bad:#ff7a70; --warn-bg:#2a2310; --warn-line:#5c4a13; --warn-ink:#f0dfa8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161c; --panel:#171d25; --ink:#e7edf2; --ink-soft:#9fb0bd;
    --accent:#5fa3c9; --accent-2:#3f6f8e; --accent-soft:#1d2b35;
    --line:#2a333d; --good:#4ad17f; --bad:#ff7a70; --warn-bg:#2a2310; --warn-line:#5c4a13; --warn-ink:#f0dfa8;
  }
  * { box-sizing: border-box; }
  html,body{ height:100%; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: inherit; }

  /* ---------- layout ---------- */
  .app{ display:flex; min-height:100%; }
  .sidebar{
    width: 300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    height:100vh; height:100dvh; position:sticky; top:0; overflow-y:auto;
    padding: 14px 10px 20px 14px;
  }
  .sidebar.open-mobile{ display:block; }
  .brand{ font-weight:700; font-size:14px; color:var(--accent); letter-spacing:.3px; margin:4px 6px 14px; }
  .brand small{ display:block; font-weight:400; color:var(--ink-soft); font-size:10.5px; margin-top:2px; }

  .progress-wrap{ margin: 0 6px 16px; }
  .progress-label{ font-size:10.5px; color:var(--ink-soft); display:flex; justify-content:space-between; margin-bottom:4px;}
  .progress-bar{ height:7px; border-radius:6px; background:var(--accent-soft); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:6px; transition:width .3s ease; }

  .nav-book{ margin-bottom:6px; }
  .nav-book > .nav-book-title{
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:8px 6px;
    font-weight:700; font-size:12.5px; color:var(--accent); border-radius:6px;
  }
  .nav-book > .nav-book-title:hover{ background:var(--accent-soft); }
  .nav-book .chev{ transition: transform .15s ease; font-size:9px; color:var(--ink-soft);}
  .nav-book.collapsed .chev{ transform: rotate(-90deg); }
  .nav-book.collapsed .nav-part{ display:none; }

  .nav-part{ margin: 2px 0 8px 4px; }
  .nav-part-title{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:8px 6px 4px; }
  .nav-chapter{
    display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:6px; cursor:pointer;
    font-size:12px; color:var(--ink); margin-bottom:1px;
  }
  .nav-chapter:hover{ background:var(--accent-soft); }
  .nav-chapter.active{ background:var(--accent); color:#fff; }
  .nav-chapter .dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--line); border:1px solid var(--ink-soft);
  }
  .nav-chapter.done .dot{ background:var(--good); border-color:var(--good); }
  .nav-chapter.active .dot{ border-color:#fff; }
  .nav-chapter .status-pending{ font-size:9px; color:var(--ink-soft); margin-left:auto; flex-shrink:0; }
  .nav-chapter.active .status-pending{ color:#cfe4ef; }

  .nav-glossary{
    display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:6px; cursor:pointer;
    font-weight:700; font-size:12.5px; color:var(--accent); margin-top:10px; border-top:1px solid var(--line); padding-top:14px;
  }
  .nav-glossary:hover{ background:var(--accent-soft); }
  .nav-glossary.active{ background:var(--accent); color:#fff; }

  /* ---------- practice section nav ---------- */
  .nav-practice-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft);
    margin:14px 6px 4px; padding-top:12px; border-top:1px solid var(--line);
  }
  .nav-drill{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer;
    font-size:12px; color:var(--ink);
  }
  .nav-drill:hover{ background:var(--accent-soft); }
  .nav-drill.active{ background:var(--accent); color:#fff; }

  /* ---------- shared drill UI ---------- */
  .drill-box{ border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--panel); text-align:center; }
  .drill-hud{ display:flex; justify-content:center; gap:22px; font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .drill-hud b{ color:var(--accent); font-size:14px; }
  .drill-chart-wrap{ display:flex; justify-content:center; margin-bottom:18px; }
  .drill-answers{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .drill-btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px 18px; font-size:13px; cursor:pointer;
    min-width:110px;
  }
  .drill-btn:hover{ background:var(--accent-2); }
  .drill-btn.pill-bull{ background:var(--good); }
  .drill-btn.pill-bear{ background:var(--bad); }
  .drill-feedback{ min-height:26px; margin-top:14px; font-size:13.5px; font-weight:700; }
  .drill-feedback.ok{ color:var(--good); }
  .drill-feedback.bad{ color:var(--bad); }
  .drill-next{ margin-top:10px; background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 14px; font-size:12.5px; cursor:pointer; }
  .drill-instruction{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }

  /* flashcards */
  .flash-wrap{ display:flex; justify-content:center; margin: 10px 0 18px; }
  .flashcard{
    width:100%; max-width:420px; min-height:170px; border:1px solid var(--line); border-radius:14px;
    background:var(--accent-soft); display:flex; align-items:center; justify-content:center; text-align:center;
    padding:22px; cursor:pointer; font-size:16px; font-weight:700; color:var(--accent); user-select:none;
  }
  .flashcard.flipped{ background:var(--panel); font-weight:400; font-size:13.5px; color:var(--ink); text-align:left; }
  .flash-controls{ display:flex; gap:10px; justify-content:center; }
  .flash-know{ background:var(--good); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13px; cursor:pointer; }
  .flash-again{ background:var(--bad); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13px; cursor:pointer; }
  .flash-progress{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-bottom:10px; }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; }
  .topbar{
    display:none; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:5;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .topbar button{
    border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px;
    padding:7px 10px; font-size:13px;
  }
  .content{ max-width: 860px; margin:0 auto; padding: 28px 22px 60px; }

  .crumb{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
  .page-title{ font-family: Georgia, 'Times New Roman', serif; font-size:22px; color:var(--accent); margin:0 0 14px; }

  .lead{ background:var(--accent-soft); border-left:4px solid var(--accent); padding:10px 14px; border-radius:0 6px 6px 0; font-size:13.5px; color:var(--ink); margin-bottom:16px; }

  .card{ border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--panel); margin-bottom:14px; }
  .card h3{ font-size:13.5px; color:var(--accent); margin:0 0 8px; font-family: Georgia, serif; }
  .card ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.55; }
  .card li{ margin-bottom:4px; }
  .grid{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  @media (max-width: 760px){ .grid{ grid-template-columns: 1fr; } }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  @media (max-width: 760px){ .grid2{ grid-template-columns: 1fr; } }

  table{ width:100%; border-collapse:collapse; margin-bottom:16px; font-size:12.5px; }
  th{ background:var(--accent); color:#fff; text-align:left; padding:7px 9px; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;}
  td{ padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:nth-child(even) td{ background: var(--accent-soft); }
  .badge-bull{ color:var(--good); font-weight:700; }
  .badge-bear{ color:var(--bad); font-weight:700; }

  .quote{ background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--warn-ink); margin:12px 0 16px; }
  .quote b{ color:var(--warn-ink); }

  .mark-row{ display:flex; align-items:center; gap:10px; margin: 18px 0 8px; padding:10px 14px; border:1px dashed var(--line); border-radius:8px; }
  .mark-row label{ font-size:12.5px; display:flex; align-items:center; gap:7px; cursor:pointer; }

  .pending-box{ text-align:center; padding: 50px 20px; border:1px dashed var(--line); border-radius:12px; color:var(--ink-soft); }
  .pending-box .big{ font-size:30px; margin-bottom:8px; }

  /* quiz */
  .quiz{ border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:22px; background:var(--panel); }
  .quiz h3{ font-family:Georgia,serif; color:var(--accent); font-size:14px; margin:0 0 12px; }
  .qitem{ margin-bottom:16px; }
  .qtext{ font-size:13px; font-weight:600; margin-bottom:8px; }
  .qopt{ display:block; font-size:12.5px; padding:7px 10px; border:1px solid var(--line); border-radius:7px; margin-bottom:6px; cursor:pointer; }
  .qopt:hover{ background:var(--accent-soft); }
  .qopt.picked{ border-color:var(--accent); background:var(--accent-soft); }
  .qopt.correct{ border-color:var(--good); background: rgba(13,122,60,0.12); }
  .qopt.wrong{ border-color:var(--bad); background: rgba(179,38,30,0.10); }
  .quiz-btn{ background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; }
  .quiz-score{ margin-top:10px; font-size:13px; font-weight:700; }

  /* glossary */
  .search-box{ display:flex; gap:8px; margin-bottom:16px; }
  .search-box input{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:13.5px;
  }
  .glossary-count{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .gterm{ border-bottom:1px solid var(--line); padding:10px 2px; }
  .gterm b{ color:var(--accent); font-size:13px; }
  .gterm p{ margin:4px 0 0; font-size:12.5px; color:var(--ink); line-height:1.5; }
  .footer-note{ margin-top:26px; font-size:10.5px; color:var(--ink-soft); text-align:center; border-top:1px solid var(--line); padding-top:10px; }

  @media (max-width: 900px){
    .sidebar{ position:fixed; left:0; top:0; z-index:20; transform:translateX(-100%); transition:transform .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.25); }
    .sidebar.open-mobile{ transform:translateX(0); }
    .topbar{ display:flex; }
    .content{ padding: 20px 16px 50px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">📈 Price Action Lernpfad<small>Al Brooks — Trilogie, eigenständig zusammengefasst</small></div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Fortschritt</span><span id="progress-text">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="nav-root"></div>
    <div class="nav-practice-title">🎮 Übungen</div>
    <div class="nav-drill" id="nav-drill-bar" onclick="showBarDrill()">🕯️ Bar-Typ erkennen</div>
    <div class="nav-drill" id="nav-drill-leg" onclick="showLegDrill()">🦵 Beine zählen</div>
    <div class="nav-drill" id="nav-drill-flash" onclick="showFlashcards()">🗂️ Glossar-Flashcards</div>
    <div class="nav-drill" id="nav-drill-tr" onclick="showTrendRangeDrill()">⚡ Trend oder Range?</div>
    <div class="nav-glossary" id="nav-glossary" onclick="showGlossary()">📖 Glossar &amp; Suche</div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button onclick="toggleSidebar()">☰ Menü</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA MODEL
   ============================================================ */
const DATA = [
  {
    id: 'buch1', title: 'Buch 1 — Trading Price Action Trends',
    parts: [
      { id: 'intro', title: 'Einleitung', chapters: [
        { id: 'b1-intro', title: 'Einleitung', status: 'done' }
      ]},
      { id: 'teil1', title: 'Teil I — Price Action (Kap. 1–12)', chapters: [
        { id: 'b1-ch1', title: 'Kap. 1 — Das Spektrum: Extrem-Trend bis Extrem-Range', status: 'done' },
        { id: 'b1-ch2', title: 'Kap. 2 — Trend Bars, Doji Bars und Climaxes', status: 'done' },
        { id: 'b1-ch3', title: 'Kap. 3 — Breakouts, Trading Ranges, Tests, Reversals', status: 'done' },
        { id: 'b1-ch4', title: 'Kap. 4 — Bar-Basics: Signal-/Entry-Bars, Setups, Candles', status: 'done' },
        { id: 'b1-ch5', title: 'Kap. 5 — Signal-Bars: Reversal Bars', status: 'done' },
        { id: 'b1-ch6', title: 'Kap. 6 — Signal-Bars: weitere Typen', status: 'done' },
        { id: 'b1-ch7', title: 'Kap. 7 — Outside Bars', status: 'done' },
        { id: 'b1-ch8', title: 'Kap. 8 — Die Bedeutung des Bar-Schlusskurses', status: 'done' },
        { id: 'b1-ch9', title: 'Kap. 9 — ETFs und Invers-Charts', status: 'done' },
        { id: 'b1-ch10', title: 'Kap. 10 — Second Entries', status: 'done' },
        { id: 'b1-ch11', title: 'Kap. 11 — Späte &amp; verpasste Einstiege', status: 'done' },
        { id: 'b1-ch12', title: 'Kap. 12 — Muster-Evolution', status: 'done' }
      ]},
      { id: 'teil2', title: 'Teil II — Trendlinien &amp; Kanallinien (Kap. 13–17)', chapters: [
        { id: 'b1-ch13', title: 'Kap. 13 — Trendlinien', status: 'done' },
        { id: 'b1-ch14', title: 'Kap. 14 — Trendkanallinien', status: 'done' },
        { id: 'b1-ch15', title: 'Kap. 15 — Channels', status: 'done' },
        { id: 'b1-ch16', title: 'Kap. 16 — Mikro-Channels', status: 'done' },
        { id: 'b1-ch17', title: 'Kap. 17 — Horizontale Linien: Swing-Punkte &amp; Kernpreise', status: 'done' }
      ]},
      { id: 'teil3', title: 'Teil III — Trends (Kap. 18–20)', chapters: [
        { id: 'b1-ch18', title: 'Kap. 18 — Beispiel: einen Trend traden', status: 'done' },
        { id: 'b1-ch19', title: 'Kap. 19 — Zeichen der Stärke in einem Trend', status: 'done' },
        { id: 'b1-ch20', title: 'Kap. 20 — Two Legs', status: 'done' }
      ]},
      { id: 'teil4', title: 'Teil IV — Häufige Trendmuster (Kap. 21–26)', chapters: [
        { id: 'b1-ch21', title: 'Kap. 21 — Spike-and-Channel-Trend', status: 'done' },
        { id: 'b1-ch22', title: 'Kap. 22 — Trending Trading Range Days', status: 'done' },
        { id: 'b1-ch23', title: 'Kap. 23 — Trend from the Open &amp; kleine Pullback-Trends', status: 'done' },
        { id: 'b1-ch24', title: 'Kap. 24 — Reversal Day', status: 'done' },
        { id: 'b1-ch25', title: 'Kap. 25 — Trend Resumption Day', status: 'done' },
        { id: 'b1-ch26', title: 'Kap. 26 — Stairs: Broad Channel Trend', status: 'done' }
      ]}
    ]
  },
  {
    id: 'buch2', title: 'Buch 2 — Trading Price Action Trading Ranges',
    note: 'Noch nicht hochgeladen — Gliederung vorbereitet nach Brooks\' eigener Themenübersicht.',
    parts: [
      { id: 'b2-themen', title: 'Themen (grobe Übersicht)', chapters: [
        { id: 'b2-breakouts', title: 'Breakouts', status: 'pending' },
        { id: 'b2-gaps', title: 'Gaps', status: 'pending' },
        { id: 'b2-magnets', title: 'Magnete, Support &amp; Resistance', status: 'pending' },
        { id: 'b2-pullbacks', title: 'Pullbacks', status: 'pending' },
        { id: 'b2-ranges', title: 'Trading Ranges', status: 'pending' },
        { id: 'b2-management', title: 'Order- &amp; Trade-Management', status: 'pending' },
        { id: 'b2-math', title: 'Mathematik des Tradings', status: 'pending' }
      ]}
    ]
  },
  {
    id: 'buch3', title: 'Buch 3 — Trading Price Action Reversals',
    note: 'Noch nicht hochgeladen — Gliederung vorbereitet nach Brooks\' eigener Themenübersicht.',
    parts: [
      { id: 'b3-themen', title: 'Themen (grobe Übersicht)', chapters: [
        { id: 'b3-reversals', title: 'Trendumkehr', status: 'pending' },
        { id: 'b3-daytrading', title: 'Daytrading', status: 'pending' },
        { id: 'b3-charts', title: 'Tages-, Wochen- &amp; Monatscharts', status: 'pending' },
        { id: 'b3-options', title: 'Optionen', status: 'pending' },
        { id: 'b3-best', title: 'Beste Setups', status: 'pending' },
        { id: 'b3-guidelines', title: 'Guidelines', status: 'pending' }
      ]}
    ]
  }
];

/* Flat lookup */
const CHAPTERS = {};
DATA.forEach(book => book.parts.forEach(part => part.chapters.forEach(ch => {
  CHAPTERS[ch.id] = Object.assign({}, ch, { bookTitle: book.title, partTitle: part.title });
})));

/* ============================================================
   CONTENT (only for status:'done' chapters — rest render as pending)
   ============================================================ */
const CONTENT = {};
const QUIZZES = {};

CONTENT['b1-intro'] = `
  <div class="lead">Bevor es um einzelne Setups geht, legt Brooks offen, wie er den Markt grundsätzlich sieht — daraus folgt fast alles Weitere in der Trilogie.</div>

  <div class="card"><h3>Die Trilogie im Überblick</h3>
    <table>
      <tr><th>Band</th><th>Schwerpunkt</th></tr>
      <tr><td><b>Buch 1 — Trends</b></td><td>Grundlagen der Price Action, Bar-Typen, Trendlinien/-kanäle, Trends</td></tr>
      <tr><td><b>Buch 2 — Trading Ranges</b></td><td>Breakouts, Gaps, Magnete, Pullbacks, Ranges, Order-/Trade-Management, Mathematik</td></tr>
      <tr><td><b>Buch 3 — Reversals</b></td><td>Trendumkehr, Daytrading, Tages-/Wochen-/Monatscharts, Optionen, beste Setups, Guidelines</td></tr>
    </table>
  </div>

  <div class="grid">
    <div class="card"><h3>Der Markt = Institutionen</h3><ul>
      <li>Der Großteil des Volumens stammt von profitablen Institutionen &amp; Handelsprogrammen</li>
      <li>Jeder Kurs entsteht nur, weil auf beiden Seiten institutionelles Interesse besteht</li>
      <li>Eigene Stopps werden nur erreicht, wenn dort ohnehin gehandelt würde — nicht weil sie „gejagt" werden</li>
    </ul></div>
    <div class="card"><h3>Nur der Chart zählt</h3><ul>
      <li>News, TV-Experten, fremde Meinungen werden bewusst ignoriert</li>
      <li>Bullische News können trotzdem zu fallenden Kursen führen</li>
      <li>Experten mit Monats-/Jahres-Horizont sind für Intraday-Entscheidungen irrelevant</li>
    </ul></div>
    <div class="card"><h3>Bewusst minimalistisch</h3><ul>
      <li>Ein Chart, ein 20er-EMA — keine weiteren Indikatoren nötig</li>
      <li>Die meisten Indikatoren bilden nur ab, was im Kursverlauf direkt sichtbar ist</li>
      <li>Zu viele Signale gleichzeitig verlangsamen die Entscheidung genau dann, wenn Tempo zählt</li>
    </ul></div>
  </div>

  <div class="quote"><b>Zentrales Prinzip:</b> Jeder Bar liefert Information — auch unscheinbare. Wer Bars pauschal als „Rauschen" abtut, übersieht systematisch handelbare Chancen.</div>

  <div class="card"><h3>Wahrscheinlichkeits-Spektrum</h3><ul>
    <li>Die meiste Zeit des Tages: ≈50/50 — typisch für eine Trading Range</li>
    <li>Kurze bessere Phasen: ≈60 %</li>
    <li>Spike-Phase eines starken Trends: ≈70 % oder mehr, aber selten und kurz</li>
    <li>Feste, immer gültige Regeln kann es in einem Zero-Sum-Game nicht geben — nur Wahrscheinlichkeiten</li>
  </ul></div>

  <div class="card"><h3>Erkennungsmerkmale: starker Trend</h3><ul>
    <li>Überwiegend Trend-Bars in Trendrichtung, kaum Overlap, wenig/keine Dochte</li>
    <li>Kleine Gaps zwischen Bar-Körpern (Measuring/Micro Gaps) als Stärkezeichen</li>

      <li>Die meisten "Reversal"-Versuche enden NICHT in einem neuen Gegentrend, sondern nur in einer Trading Range (Flag)</li>

      <li>Selbst wenn kein echter Trendwechsel folgt, ist die Bewegung oft groß genug für einen soliden Swing-Trade</li>
      <li>Reversals sehen je nach Zeitrahmen unterschiedlich aus: ein einzelner großer Bear-Bar auf dem Monatschart kann auf dem Tageschart ein Climax + 10-Tage-Range + Breakout sein — dasselbe Ereignis, andere Auflösung</li>
    </ul></div>
  </div>

  <div class="quote"><b>Wichtig:</b> Auch der Übergang Trend→Range ist technisch ein "Reversal" (von einseitigem zu zweiseitigem Verhalten) — nur dass niemand es so nennt. Und der Übergang Range→Trend ist ebenfalls ein Reversal, wird aber "Breakout" genannt.</div>

  <div class="card"><h3>Beispiel-Walkthrough: ein kompletter Spike-and-Channel-Bull-Tag</h3><ul>
    <li>Der Tag testet zunächst das gestrige Tief — der Ausbruch nach unten scheitert (tieferes Tief, dann scharfe Umkehr) → Signal: Bullen &amp; Bären einigen sich, der Preis war "zu niedrig"</li>
    <li>Ein großer Bull-Trend-Bar markiert den eigentlichen Spike-Beginn — ab hier gilt die <b>"Always-in"-Richtung</b> als aufwärts: wer durchgehend im Markt sein muss, sollte long sein oder long suchen</li>
    <li>Nach dem Spike folgt ein Channel mit viel Overlap — mehrere Trader beginnen hier bereits, in kleinen Schritten gegen den Kanal zu shorten, in Erwartung des Tests am Kanal-Ursprung</li>
    <li>Ein Doppel-Boden (zwei Tiefs auf ähnlichem Niveau) am Ende des Rücksetzers wird zum zweiten Long-Einstieg</li>
    <li>Ein "Wedge"-Top (Drei-Schub-Muster) beendet den Kanal — hier nehmen die frühen Shorts Gewinne mit, neue Shorts steigen ein</li>
    <li>Der anschließende Zwei-Beine-Rücksetzer zum Kanalboden lässt die verbliebenen Shorts glattstellen UND die Bullen erneut am alten Kanal-Tief kaufen → daraus entsteht meist ein Bounce, der entweder eine neue Range einleitet oder direkt einen zweiten Aufwärtsimpuls</li>
  </ul></div>

  <div class="card"><h3>Kernbegriffe aus diesem Kapitel</h3>
    <table>
      <tr><th>Begriff</th><th>Bedeutung</th></tr>
      <tr><td>Always-in-Richtung</td><td>Die Position, die man halten müsste, wäre man verpflichtet, ständig long oder short zu sein — praktisch: die aktuell wahrscheinlichere Richtung</td></tr>
      <tr><td>Wedge (Keil)</td><td>Drei-Schub-Muster mit konvergierenden Linien — hier als Reversal-Signal am Ende eines Channels</td></tr>
      <tr><td>Doppel-Top/-Boden als Flag</td><td>Zwei ähnliche Hochs bzw. Tiefs, die selbst zum Fortsetzungs-Setup in Trendrichtung werden</td></tr>

    </table>
  </div>

`;

  <div class="lead">Der Reversal-Bar ist der bekannteste und zuverlässigste Signal-Bar-Typ — aber nur, wenn Kontext und Details stimmen. Dieses Kapitel liefert das Feinbild dazu.</div>

      <li>Wenig Overlap mit den Vorgänger-Bars</li>

  </div>

  <div class="quote"><b>Woraus besteht ein Reversal-Bar eigentlich?</b> Auf einem kleineren Zeitrahmen betrachtet ist jeder Bull-Reversal-Bar in Wahrheit ein Bear-Trend-Bar (Sell-Climax) gefolgt von einem Bull-Trend-Bar (Bull-Breakout) — beide müssen nicht direkt aufeinanderfolgen. Beim Bear-Reversal-Bar gilt das Gegenteil.</div>

  <div class="card"><h3>Mit-Trend vs. Countertrend: unterschiedliche Ansprüche</h3>
    <table>

    <div class="drill-instruction" style="text-align:left;margin-top:8px;">Merksatz: Je stärker der Trend, desto unwichtiger die Form des Mit-Trend-Signal-Bars — und desto wichtiger die Form des Gegentrend-Signal-Bars.</div>
  </div>

  <div class="quote"><b>Warum der Test des alten Extrems so wichtig ist:</b> Wenn der Markt zweimal versucht, ein altes Tief zu unterschreiten, und beide Male scheitert, probiert er danach meist das Gegenteil. Genau deshalb funktionieren Doppel-Tops und -Böden als Reversal-Auslöser so zuverlässig.</div>

  <div class="card"><h3>Warnsignale, die einen Reversal-Bar entwerten</h3><ul>

    <li><b>Großer Doji:</b> Ein großer, aber körperloser Bar ist im Kern eine Ein-Bar-Trading-Range — keine gute Basis, lieber ein zweites Signal abwarten</li>
    <li><b>Großer Gegendocht:</b> Wenn ein Bull-Reversal-Bar oben einen langen Docht hat, haben die Countertrend-Käufer zum Schluss hin an Überzeugung verloren</li>
    <li><b>Zu kleiner Bar:</b> Ein Reversal-Bar, der deutlich kleiner ist als die vorherigen Bars, hat wenig Kraft — außer der Körper ist trotzdem stark, dann ist wenigstens das Risiko (1 Tick über die andere Seite) gering</li>
    <li><b>Kollaps in letzter Sekunde:</b> Ein optisch perfekter Bull-Reversal-Bar mit Überschießen der Bear-Kanallinie kann in den letzten Sekunden vor Schluss komplett kippen und auf seinem Tief schließen — alle Frühkäufer sind dann gefangen</li>

  <div class="lead">Neben dem klassischen Reversal-Bar gibt es ein ganzes Arsenal weiterer Signal-Bar-Typen — aber keiner davon rechtfertigt einen Trade ohne unterstützenden Kontext. Dieses (sehr umfangreiche) Kapitel ist Brooks' Signal-Bar-Enzyklopädie.</div>

  <div class="card"><h3>Katalog: kleine Bars als Signal</h3>
    <table>
      <tr><th style="width:22%">Typ</th><th>Beschreibung</th></tr>
      <tr><td>Inside Bar</td><td>Hoch/Tief liegen innerhalb des Vorgängers — zuverlässiger, wenn klein UND Körper gegen den bisherigen Trend gerichtet</td></tr>
      <tr><td>ii / iii</td><td>Zwei bzw. drei Inside-Bars in Folge, jeder kleiner/gleich groß wie der vorherige — starkes Gleichgewichts-Signal, oft Vorbote eines größeren Gegenzugs nach einem "Final Flag"</td></tr>
      <tr><td>ioi</td><td>Inside-Bar → Outside-Bar → Inside-Bar — klassisches "Breakout-Mode"-Setup: Stopps auf beiden Seiten des zweiten Inside-Bars platzieren</td></tr>
      <tr><td>Kleiner Bar am Extrem</td><td>Kleiner Bar direkt am Hoch/Tief eines großen Trend-/Outside-Bars oder einer Range — besonders stark mit Körper in Handelsrichtung</td></tr>
      <tr><td>Micro-Doppel-Boden/-Top</td><td>Zwei (fast) identische Tiefs/Hochs in Folge — in einem Spike oft nur Ein-Bar-Flag, sonst meist echtes Reversal-Signal</td></tr>
    </table>
  </div>

  <div class="quote"><b>Doji-Ausnahme:</b> Ein Doji ist fast nie ein guter Signal-Bar (er ist ja selbst schon eine Ein-Bar-Trading-Range) — außer er sitzt am Rand einer GRÖSSEREN Trading Range (dann zählt die größere Range) oder er ist ein Mit-Trend-Setup in einem starken Trend.</div>

  <div class="grid2">
    <div class="card"><h3>Reversal-Bar als Fortsetzungs-Falle</h3><ul>
      <li>In starken Trends handelt der Markt manchmal genau ENTGEGEN einem scheinbar starken Reversal-Bar — statt darüber zu steigen, bricht er darunter aus (bzw. umgekehrt)</li>
      <li>Grund: zu früh eingestiegene Trader (vor dem eigentlichen Trigger) sitzen bereits in der Falle und werden zu Zwangsverkäufern/-käufern</li>
      <li>Lehre: ein Reversal-Bar allein reicht nie — ohne vorherige Schwäche der Gegenseite ist er nur eine potenzielle Falle</li>
    </ul></div>
    <div class="card"><h3>Shaved Bar &amp; Exhaustion Bar</h3><ul>
      <li><b>Shaved Bar:</b> kein Docht an einem/beiden Enden — Setup nur relevant in einem bereits starken Trend</li>
      <li>Achtung: in einer ruhigen, volumenarmen Trading Range bedeuten gehäufte Shaved Bars oft gar nichts (kein Trend, nur wenig Volumen) — dann eher Fallen als Stärke</li>
      <li><b>Exhaustion Bar:</b> ein ungewöhnlich großer Trend-Bar nach 10+ Bars Trend deutet oft eine emotionale Erschöpfung an — meist mind. 10 Bars Korrektur in zwei Beinen, manchmal echtes Reversal</li>
    </ul></div>
  </div>

  <div class="card"><h3>Trend-Bars als Signal in Pullbacks &amp; Ranges</h3><ul>
    <li>Nach 20+ Bars durchgehend über dem EMA in einem starken Bull-Trend: der erste kleine Bear-Trend-Bar, der nur knapp unter den EMA schließt, ist oft ein Kauf-Setup für die Fortsetzung</li>
    <li>In einer klaren Trading Range: ein zweibeiniger Spike zu einem knapp neuen Hoch (z. B. Top eines kleinen Keils oder Test einer Bear-Trendlinie) ist oft ein gutes Short-Setup — und gespiegelt am unteren Rand ein Long-Setup</li>
  </ul></div>

  <div class="card"><h3>Alle Bars in einem Channel</h3><ul>
    <li>In einem Bull-Channel: Bullen platzieren Kauf-Limits bei/unter jedem Vorgänger-Tief, Bären Verkaufs-Limits bei/über jedem Vorgänger-Hoch UND jedem Swing-Hoch</li>
    <li>Zusätzlich: Bull-Stopps über Pullback-Hochs, Bear-Stopps unter Tiefs am oberen Rand des Kanals — im Bear-Channel exakt gespiegelt</li>
  </ul></div>

  <div class="card"><h3>Trade-Management-Details zum ii-Pattern</h3><ul>
    <li>Stop liegt jenseits der Gegenseite BEIDER Bars (nicht nur des zweiten) — bei relativ großen Bars reicht manchmal auch nur jenseits des zweiten</li>
    <li>Nach Schluss des Entry-Bars: Stop enger ziehen und bereit sein, bei einem Fehlversuch der nächsten Bars sofort in die Gegenrichtung zu drehen — Fehlversuche direkt nach ii-Ausbrüchen sind häufig</li>
    <li>Bei entgegengesetzten Fehlausbrüchen in beide Richtungen kurz hintereinander (beide Seiten wurden gefangen): das spricht für einen zuverlässigeren dritten Versuch in die tatsächliche Richtung</li>
    <li><b>Vorsicht-Fenster:</b> kleine, körperlose Dojis nahe am EMA zwischen ca. 10 und 11 Uhr Ortszeit (des Autors) haben laut Buch eine besonders hohe Fehlerquote</li>
  </ul></div>

  <div class="card"><h3>Drei Beispiel-Walkthroughs aus dem Buch</h3>

    <h3 style="margin-top:14px;font-size:12.5px;">① Schwache Signal-Bars halten einen Trend am Laufen</h3>
    <ul>
      <li>In einem Bear-Trend sehen fast alle Short-Signale schwach aus (viele Dojis) — trotzdem funktionieren sie, weil Bären ungeduldig nachlegen und gefangene Bullen mit kleinem Verlust aussteigen müssen</li>
      <li>Genau diese "hässlichen" Signale erzeugen die Spannung, die den Trend am Laufen hält — ein "perfektes" Setup kommt oft einfach nie</li>
    </ul>

    <h3 style="margin-top:14px;font-size:12.5px;">② Ein riesiger Trend-Bar als Erschöpfungs-Signal</h3>
    <ul>
      <li>Ein außergewöhnlich großer Bar kollabiert durch eine Trendkanallinie — direkt gefolgt von einem Inside-Bar mit „shaved top" (Käufer drücken bis zum Schluss)</li>
      <li>Zusammen bilden beide Bars einen Spike-runter-Spike-rauf — auf irgendeinem höheren Zeitrahmen ein sauberes Zwei-Bar-Reversal</li>
      <li>Ein direkt danach folgender Bear-Reversal-Bar wird sofort wieder überboten — die Short-Seite wird ausgestoppt, weil die Aufwärtsdynamik (11 Bull-Bars in Folge zuvor) schlicht zu stark war</li>
    </ul>

    <h3 style="margin-top:14px;font-size:12.5px;">③ Doppel-Boden-Pullback + ii-Setup + dritter Versuch nach zwei Fehlausbrüchen</h3>
    <ul>
      <li>Ein tieferes Tief wird von einem fast identischen zweiten Tief erneut getestet (Doppel-Boden), danach folgt ein höheres Tief</li>
      <li>Am höheren Tief bildet sich ein "ii"-Muster (Inside-Bar auf Inside-Bar) → Einstieg 1 Tick über dem zweiten Bar</li>
      <li>Ausbruch nach oben scheitert, Ausbruch nach unten scheitert ebenfalls kurz danach → beide Seiten sind jetzt gefangen</li>
      <li>Der dritte Versuch (in Wirklichkeit nur ein Pullback vom ersten Ausbruch) wird zum zuverlässigsten Einstieg der ganzen Sequenz</li>
    </ul>
  </div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 6 aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

CONTENT['b1-ch7'] = `
  <div class="lead">Ein Outside Bar überdeckt den gesamten Vorgänger-Bar — Hoch darüber, Tief darunter. Beide Seiten hatten irgendwann während des Bars die Kontrolle, was ihn zu einem der kniffligsten Bar-Typen macht.</div>

  <div class="card"><h3>Definition &amp; Grundproblem</h3><ul>
    <li>Hoch über dem Vorgänger-Hoch UND Tief unter dem Vorgänger-Tief</li>
    <li>Schließt der Bar nahe seiner Mitte, ist er im Kern eine Ein-Bar-Trading-Range (er überlappt den Vorgänger per Definition zu 100 %)</li>
    <li>Klassische Technische-Analyse-Lehre: Stop-Orders über UND unter dem Bar platzieren, nach Fill die andere Order verdoppeln und zur Reversal-Order machen — Brooks hält davon meist wenig, weil das Risiko bei einem großen 5-Min-Outside-Bar zu groß wird</li>
    <li>Praktikablere Alternativen: Bar-Schluss abwarten und dann erst den Ausbruch handeln, oder mit Money-Stop/kleinerer Positionsgröße arbeiten, falls man doch direkt einsteigt</li>
  </ul></div>

  <div class="quote"><b>Faustregel bei Unsicherheit:</b> Das Wichtigste zu Outside Bars überhaupt — wenn du nicht sicher bist, was ein Outside Bar bedeutet, warte einfach auf mehr Preis-Information, bevor du handelst.</div>

  <div class="grid2">
    <div class="card"><h3>Wann ein Outside Bar ein guter Entry-Bar ist</h3><ul>
      <li>Wenn der Bar VOR dem Outside Bar bereits ein ordentlicher Signal-Bar war (z. B. ein solider Bull-Reversal-Bar), der kurz angetestet, aber nicht bestätigt wurde</li>
      <li>Bricht der nächste Bar dann doch wieder über dessen Hoch, wird er zum Outside-Up-Bar UND zugleich zum gültigen Entry — die Kauf-Logik bleibt identisch, nur die Füllung kam etwas später</li>
      <li>Besonders gut als <b>zweiter Versuch</b> nach Trendlinienbruch oder Kanallinien-Überschießen: hier bedeutet ein Fill auf einem Outside Bar meist echte Käuferstärke</li>
    </ul></div>
    <div class="card"><h3>Wann ein Outside Bar bedeutungslos ist</h3><ul>
      <li>Mitten in einer Trading Range: bestätigt nur, was ohnehin klar ist (Gleichgewicht) — kein Handelsgrund für sich allein</li>
      <li>Ausnahme: ein kleiner Bar direkt an seinem Hoch/Tief kann ein Fade-Setup einleiten</li>
      <li>Ein "oo"-Muster (Outside-Bar gefolgt von noch größerem Outside-Bar) ist meist einfach eine noch größere Trading Range, kein Ausbruchssignal</li>
    </ul></div>
  </div>

  <div class="card"><h3>Das ioi-Muster (Inside-Outside-Inside)</h3><ul>
    <li>Inside-Bar → Outside-Bar → Inside-Bar: der zweite Inside-Bar wird zum Ausbruchs-Setup</li>
    <li>Nur handeln, wenn realistisch genug Raum bis zum Kursziel bleibt — in engem "Barbwire" (extrem enger Range) lieber auf ein stärkeres Setup warten</li>
    <li>Liegt das Muster an einem neuen Swing-Extrem UND schließt der zweite Inside-Bar stark in Ausbruchsrichtung, spricht das für einen zuverlässigen zweiten Einstieg</li>
  </ul></div>

  <div class="card"><h3>Der Sonderfall: Outside Bar als Auftakt einer echten Trendumkehr</h3>
    <div class="drill-instruction" style="text-align:left;margin-bottom:8px;">Das ist der komplexeste und wichtigste Mechanismus dieses Kapitels — eine Kettenreaktion aus zwei gleichzeitigen Fallen:</div>
    <ul>
      <li>In einem Bear-Trend bildet sich ein starker Reversal-Aufwärtsversuch. Die aggressivsten Bullen warten nicht auf den Ausbruch übers Vorgänger-Hoch — sie kaufen bereits UNTER dem Vorgänger-Tief</li>
      <li>Das zieht den Bar über das Vorgänger-Hoch hinaus → er wird zum Outside-Up-Bar</li>
      <li>Bären, die gerade erst unter dem Vorgänger-Tief geshortet hatten (in Erwartung einer normalen Bear-Flag-Fortsetzung), sitzen jetzt in der Falle — sie decken sich ein</li>
      <li>Gleichzeitig bleiben viele Bullen außen vor, weil sie ungern in einen gerade entstehenden Outside Bar hinein kaufen (zu unklar) — auch sie werden dadurch "gefangen", allerdings auf der falschen (zu späten) Seite</li>
      <li>Ergebnis: beide Seiten wollen denselben kleinen Rücksetzer — Bären zum günstigeren Ausstieg, Bullen zum günstigeren Einstieg. Weil <i>beide</i> das Gleiche wollen, kommt der Rücksetzer einfach nicht — der Markt kauft schon 2–3-Tick-Dips auf, bevor ein echter Pullback entstehen kann</li>
      <li>Das eigentliche neue Bein beginnt daher NICHT am alten Bear-Tief, sondern erst am höheren Tief, an dem der Markt sich einig wurde, dass es jetzt aufwärts geht — auch wenn im Chart optisch drei Beine erscheinen, zählt funktional meist nur eins bis zwei</li>
    </ul>
  </div>

  <div class="quote"><b>Aus institutioneller Perspektive:</b> Eine Institution, die auf eine Rallye setzt, verkauft bewusst mit, bis die Bear-Flag-Shorts auslösen — und kauft dann genau unter dem Vorgänger-Tief massiv gegen die frisch eröffneten Shorts. Sobald die Falle zugeschnappt ist, kauft sie weiter aggressiv nach oben, während sowohl gefangene Bären als auch zu spät gekommene Bullen dem Markt hinterherlaufen müssen.</div>

  <div class="card"><h3>Beispiel-Walkthroughs</h3>
    <h3 style="margin-top:14px;font-size:12.5px;">① Outside-Up-Bar in einem starken Bear-Trend</h3>
    <ul>
      <li>Ein Outside-Up-Bar erscheint mitten in einem klaren Bear-Trend — trotzdem NICHT long denken</li>
      <li>Richtige Lesart: nur auf einen Abwärts-Ausbruch warten; schließt der nächste Bar als kräftiger Bear-Trend-Bar, dort unter dessen Tief shorten (gefangene Longs müssen aussteigen)</li>
    </ul>
    <h3 style="margin-top:14px;font-size:12.5px;">② Doppelte Falle: High-2-Long kippt zum Outside-Down-Bar</h3>
    <ul>
      <li>Ein High-2-Long-Setup wird ausgelöst, obwohl 5 der letzten 6 Bars Bear-Bars waren — ein grundsätzlich schwaches Setup ohne vorherige Stärke</li>
      <li>Der Entry-Bar kippt direkt zum Outside-Down-Bar: Longs sitzen in der Falle, Bären werden aus einem vorherigen Fehlversuch ebenfalls "getrapped" — dieser Bar verhält sich danach wie ein waschechter Bear-Trend-Bar, nicht wie ein neutraler Outside Bar</li>
      <li>Lehre: ein High-2 (oder High-1) ist für sich genommen NIE ein Setup — es braucht vorher belegte Stärke (z. B. einen Trendlinienbruch oder einen klar bullischen Bar), sonst ist die Ausgangslage zu schwach</li>
    </ul>
  </div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 7 aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

CONTENT['b1-ch10'] = `
  <div class="lead">Sowohl Tops als auch Böden brauchen meist einen zweiten Anlauf, bevor genug Trader überzeugt sind. Zweite Einstiege sind fast immer die bessere Wahl — mit einer wichtigen Ausnahme.</div>

  <div class="quote"><b>Die Falle im Detail — "Good fill, bad trade":</b> Lässt dich ein zweiter Einstieg zu einem BESSEREN Preis rein als der erste Versuch, sei misstrauisch. Gute zweite Einstiege kosten normalerweise gleich viel oder mehr — der Markt "bestraft" das späte, vorsichtige Einsteigen leicht. Ein ungewöhnlich guter Fill bedeutet meist: du übersiehst etwas, und der Trade scheitert.</div>

  <div class="card"><h3>Warum das so ist</h3><ul>
    <li>Trader, die auf einen zweiten Einstieg warten, wollen ihr Risiko minimieren und weichen dafür oft auf kleinere Zeitrahmen aus</li>
    <li>Dadurch steigen sie faktisch NACH vielen anderen Marktteilnehmern ein — der Preis ist für sie tendenziell schon etwas schlechter</li>
    <li>Bietet der Markt stattdessen einen unerwartet guten Preis an, ist das ein Warnsignal, kein Geschenk</li>
  </ul></div>

  <div class="card"><h3>Die zentrale Regel: bei starkem Momentum den ersten Gegenversuch NIE handeln</h3><ul>
    <li>Nach 3–4+ aufeinanderfolgenden Trend-Bars in eine Richtung ist zu viel Wucht im Markt, um schon beim ersten Reversal-Versuch dagegenzuhalten</li>
    <li>Richtige Vorgehensweise: den ersten Reversal-Versuch bewusst NICHT handeln, abwarten, ob der Trend sich noch 1–2 Bars fortsetzt, und erst beim zweiten Umkehrversuch einsteigen</li>
    <li>Kommt kein zweiter Versuch zustande, ist das Ausbleiben des Trades bereits der Erfolg — ein vermiedener Verlust zählt genauso wie ein Gewinn</li>

  <div class="quote"><b>Randnotiz:</b> Die meisten echten Tops entstehen aus einer Art Micro-Doppel-Top, die meisten Böden aus einem Micro-Doppel-Boden (Details dazu in Buch 3) — ein weiterer Grund, warum der "zweite Versuch" strukturell so oft die Rolle des eigentlichen Wendepunkts übernimmt.</div>

  </ul></div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 10 aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

  <div class="lead">Kein Muster ist in Stein gemeißelt. Setups scheitern häufig — und genau dieses Scheitern wird selbst wieder zum nächsten, oft noch besseren Setup. Namen sind dabei komplett zweitrangig.</div>

  <div class="quote"><b>Kernprinzip:</b> Der aktuelle Bar kann immer der Beginn einer großen Bewegung in EINE der beiden Richtungen sein. Ein Muster, das gerade abgeschlossen scheint, kann sich jederzeit in ein größeres oder ein völlig anderes Muster weiterentwickeln — und das ist keine Ausnahme, sondern der Normalfall.</div>

  <div class="lead">Teil II beginnt mit dem einfachsten und zugleich wichtigsten Werkzeug: der Trendlinie. Eine Bull-Trendlinie verläuft entlang der Tiefs, eine Bear-Trendlinie entlang der Hochs — und ihr Bruch ist eines der zuverlässigsten Signale überhaupt, dass sich etwas ändert.</div>

  <div class="card"><h3>Wie man Trendlinien zeichnet</h3><ul>
    <li>Über Swing-Punkte, per Augenmaß ("best fit") oder rechnerisch (lineare Regression)</li>
    <li>Manchmal nur über die Candle-Körper statt über die Dochte — besonders bei Keil-Mustern üblich, die selten eine perfekte Keilform zeigen</li>
    <li>Praxis-Tipp: Linie nur kurz einzeichnen, prüfen ob der Markt sie berührt hat, dann wieder löschen — zu viele Linien auf dem Chart lenken vom eigentlichen Preisverhalten ab</li>
  </ul></div>

  <div class="quote"><b>Die wichtigste Aussage des ganzen Kapitels:</b> Die meisten Ausbrüche (Breakouts) scheitern! Wenn der Markt in einem Bull-Trend scharf zur Trendlinie zurückfällt, denken Anfänger reflexhaft "jetzt kommt der Crash" und shorten genau dort. Erfahrene Trader tun das Gegenteil: sie kaufen an und unter der Linie, weil die Linie meist hält und der Trend nur "nachfragt", ob es noch genug Käufer gibt.</div>

  <div class="grid2">
    <div class="card"><h3>Solange die Linie hält</h3><ul>
      <li>Jeder Rücksetzer zur Trendlinie (auch mit leichtem Über-/Unterschießen) ist ein potenzielles Mit-Trend-Setup</li>
      <li>Je länger eine Trendlinie schon Bestand hat (mehrere Dutzend Bars), desto wahrscheinlicher wird nach einem Bruch trotzdem noch einmal das alte Extrem getestet</li>
    </ul></div>
    <div class="card"><h3>Nach dem Bruch</h3><ul>
      <li>Der Bruch selbst ist das wichtigste Signal: er zeigt, dass nicht mehr nur eine Seite die Kontrolle hat — Zweiseitigkeit wird wahrscheinlicher</li>
      <li>Jeder neue Bruch liefert einen neuen Swing-Punkt für die nächste Linie — meist mit flacherer Steigung als die vorherige (= nachlassendes Momentum)</li>
      <li>Werden irgendwann die Linien der GEGENRICHTUNG wichtiger als die alten, hat der Trend faktisch gedreht</li>

  <div class="card"><h3>Der Sonderfall: viele Tests auf engem Raum</h3><ul>

    <li>Beispiel aus dem Buch: eine Bear-Trendlinie wurde ca. 15-mal getestet, bevor die Bullen aufgaben, anfingen ihre Longs zu verkaufen — und der Markt dadurch nach unten beschleunigte statt nach oben auszubrechen</li>
  </ul></div>

  <div class="card"><h3>Gaps &amp; große Trend-Bars als Ein-Bar-Trend</h3><ul>
    <li>Eine Kurslücke oder ein sehr großer Trend-Bar zählt selbst schon als "Ein-Bar-Trend" bzw. Ausbruch — jede seitwärts laufende Bar-Serie danach "bricht" diese Mini-Trendlinie bereits</li>
    <li>Meistens entsteht daraus einfach eine Flag mit Fortsetzung, manchmal aber ein echter Reversal — bei gutem Gegentrend-Signal-Bar lohnt sich dann auch das Faden</li>

  <div class="card"><h3>Trendkanallinie als Parallele nutzen</h3><ul>

  <div class="quote"><b>Wichtige Nuance:</b> Bricht der Kurs stattdessen durch die "falsche" Seite eines fallenden Kanals (also weiter nach unten), scheitert dieser Ausbruch meist innerhalb von ~5 Bars und dreht — kann aber auch der Start eines noch stärkeren neuen Beins sein. Beide Möglichkeiten offen halten.</div>

  <div class="card"><h3>Wedge = Trendkanallinien-Überschießen — praktisch dasselbe Phänomen</h3><ul>
    <li>Die meisten Keile werden durch ein gescheitertes Trendkanallinien-Überschießen ausgelöst; die meisten Kanallinien-Reversals sind im Kern Keil-Reversals — auch wenn die Keilform nicht perfekt aussieht</li>
    <li>Ein Keil entsteht durch Dringlichkeit: Trendlinie steiler als Kanallinie bedeutet, Bullen kaufen bereits kleinere Rücksetzer UND Bären nehmen bereits bei kleineren Gegenbewegungen Gewinne mit — beide sind "nervöser" als in einem normalen Kanal</li>
    <li>Der zweite Pullback verrät es: kauft der Markt schon VOR der eigentlichen (flacheren) Trendlinie, zeichnen Trader eine neue, steilere Linie — und beobachten, ob der dritte Schub die alte, flachere Kanallinie oder eine neue, steilere erreicht</li>
    <li>Hält die alte (flachere) Linie den dritten Schub auf, ohne die neue steilere zu erreichen: das ist das klassische Keil-Top-Signal — Bullen haben zu früh Gewinne mitgenommen, Bären waren zu ungeduldig, jetzt kippt die Dynamik</li>
  </ul></div>

  <div class="quote"><b>Warum Reversals an Kanallinien-Überschießen so zuverlässig kommen — Brooks' eigene Erklärung:</b> Die klassische Erzählung ("verzweifelte Verlierer kapitulieren alle gleichzeitig, dann bricht die Euphorie zusammen") hält Brooks in einem von Institutionen und Computern dominierten Markt für weitgehend irrelevant. Seine Version: Smart Money kauft systematisch weiter, bis der Kurs über die Kanallinie gedrückt wird — genau DANN nehmen sie planmäßig Gewinne mit, nicht aus Panik, sondern weil ihre Modelle das so vorgeben. Das Ergebnis sieht am Ende gleich aus, der Mechanismus dahinter ist aber ein anderer.</div>

  <div class="card"><h3>Selbstdiagnose-Regel für Trader</h3><ul>
    <li>Musst du deine Trendkanallinie immer wieder neu (steiler) einzeichnen, weil der Trend jedes Mal weiterläuft? Das ist ein Warnsignal, dass DU auf der falschen Seite stehst</li>
    <li>Richtige Reaktion: mit dem Trend handeln, bis ein wirklich überzeugendes Reversal da ist — nicht stur gegen einen immer stärker werdenden Trend wetten</li>
  </ul></div>

  <div class="card"><h3>Was danach passiert, wenn der Top wirklich fest steht</h3><ul>
    <li>Smart Money kauft nicht mehr — im Gegenteil, viele halten ihre Shorts sogar durch ein neues Hoch hindurch und stocken sogar auf, um ihren Durchschnittspreis zu verbessern</li>
    <li>Ohne verbleibende Käufer kann der Markt kaum noch woanders hin als runter</li>
    <li>Am eigentlichen Boden ist das Volumen oft riesig — bestehend aus gewinnmitnehmenden Bären, neuen Langfrist-Käufern, HFT-Scalpern direkt an der Unterstützung und Hedging-Aktivität aus anderen Märkten; Kleinanleger machen laut Brooks auch hier unter 5 % des Volumens aus</li>
  </ul></div>

  <div class="quote"><b>Kleine Beobachtung am Rande:</b> Die Steigung der letzten Flag vor einem Trendwechsel gibt oft schon eine grobe Ahnung von der Steigung des NEUEN Trends danach — nett zu wissen, aber nie die Hauptgrundlage einer Entscheidung.</div>

  <div class="card"><h3>Beispiel-Walkthrough: Lange Trendkanallinie &amp; "Shrinking Stairs"</h3><ul>
    <li>Eine über zwei weit auseinanderliegende Tiefs gezogene Kanallinie wird von einem dritten, sehr nahen Tief nur knapp durchbrochen — als alleinige Basis für einen Gegentrend-Trade eigentlich zu schwach (Linien wirken am besten, wenn ein drittes, klar separates Bein sie bestätigt)</li>
    <li>Trotzdem lohnt der Trade: der auslösende Bar ist klein → gutes Chance-Risiko-Verhältnis</li>
    <li>Zusätzliche Bestätigung liefert ein "Shrinking Stairs"-Muster: jeder neue Tiefststoß fällt kleiner aus als der vorherige — ein Zeichen nachlassenden Bär-Momentums, das den Long-Versuch stützt</li>
  </ul></div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 14 aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

  <div class="lead">Ein Mikro-Channel ist die extremste Form eines engen Channels: eine Trendlinie über 2–10 Bars mit fast keinen Pullbacks. Die wichtigste Lehre daraus betrifft weniger die Definition als eine harte Handelsregel.</div>

    <li>Das erste Pullback-Signal danach scheitert dann besonders zuverlässig, statt einen echten Trendwechsel einzuleiten</li>

CONTENT['b1-ch18'] = `
  <div class="lead">Teil III beginnt mit der Definition des Trends selbst und mündet in Kapitel 18 direkt in eine ausführliche Praxis-Anleitung: wie man einen laufenden Trend tatsächlich handelt — inkl. eines kompletten Tages-Beispiels (GS-Aktie).</div>

  <div class="card"><h3>Teil-III-Einleitung: Was einen Trend überhaupt ausmacht</h3><ul>
    <li>Trend, Swing, Pullback, Leg sind vier Namen für im Kern dasselbe Phänomen auf unterschiedlicher Größenskala — die genaue Abgrenzung ist nebensächlich</li>
    <li><b>Bildschirm-Test:</b> laufen die Bars von einer unteren Bildschirmecke zur gegenüberliegenden oberen Ecke, ohne große Gegenausschläge dazwischen? Dann ist es ein Trend</li>
    <li><b>Bauchgefühl-Test:</b> fühlst du Unsicherheit → wahrscheinlich Trading Range. Fühlst du Dringlichkeit und hoffst auf einen Pullback zum Einsteigen → wahrscheinlich Trend</li>
    <li>Ein echter Trend braucht IMMER beides: einen Bruch der alten Trendlinie/Range-Grenze UND anschließend trendende Swings (klar steigende oder fallende Hochs/Tiefs)</li>
    <li>Ca. 80 % aller Versuche, einen Trend umzukehren, scheitern — der beste Einstieg ist daher meist der ALLERERSTE Pullback direkt nach dem ursprünglichen Trendlinienbruch, bevor der Trend für alle sichtbar "etabliert" ist</li>
  </ul></div>

  <div class="quote"><b>Warum Mit-Trend-Einstiege sich so falsch anfühlen — und genau deshalb funktionieren:</b> In einem Bear-Trend ist sich niemand sicher, ob gleich ein Bounce kommt, aber (fast) alle sind sich sicher, dass der Kurs bald noch tiefer steht. Deshalb verkaufen Longs sofort und Bären wollen sofort rein — ein nennenswerter Pullback bildet sich dadurch erst gar nicht. Der Bildschirm suggeriert "hier ist bestimmt kein Platz mehr" — das ist eine optische Täuschung, keine Marktinformation.</div>

  <div class="card"><h3>Wie ein Trend reift — die typische Lebenskurve</h3><ul>
    <li><b>Früh:</b> starke Seite kauft/verkauft relentlos in kleinen Stücken (verteilt auf viele Preise, um das Dollar-Risiko konstant zu halten) — Pullbacks bleiben winzig</li>
    <li><b>Reife:</b> Pullbacks werden allmählich größer und länger, Overlap nimmt zu, erste Gegentrend-Bars mit Dochten erscheinen — die starke Seite beginnt an neuen Extremen eher Gewinne mitzunehmen statt nachzukaufen</li>
    <li><b>Wende:</b> die Gegenseite beginnt, an neuen Extremen aktiv zu shorten/kaufen statt nur Gewinne zu realisieren — der Markt kippt in eine echte Trading Range, aus der später ein Reversal werden kann</li>
    <li>Ein Ausbruch über ein altes Swing-Hoch endet fast immer in einem von drei Szenarien: weiteres Kaufen (Fortsetzung), Gewinnmitnahme (mit Abstand am häufigsten), oder aktives Faden — lesbar daran, wie weit/schnell der Kurs über das alte Hoch hinausläuft</li>
  </ul></div>

  <div class="quote"><b>Randnotiz zu Extremsituationen (2008er-Crash als Beispiel):</b> Erzwungener, emotionsgetriebener Verkaufsdruck (Privatanleger in Panik, Hedgefonds-Rückgaben, Anreiz-Gebühren-Logik von Fondsmanagern) kann Kurse weit unter jeden fundamentalen Wert drücken und tagelange Extremschwankungen erzeugen. Lehre daraus: nie allein wegen einer Fibonacci-Kennzahl (38 %/50 %/62 %) kaufen — es braucht immer zusätzlich einen echten Trendlinienbruch als Preis-Aktions-Bestätigung.</div>

  <div class="card"><h3>Kapitel 18: Die zwei Werkzeugkästen für Mit-Trend-Einstiege</h3>
    <table>
      <tr><th style="width:30%">Kategorie</th><th>Beispiele</th></tr>
      <tr><td>Stop-Orders (einfacher)</td><td>High-2-/Low-2-Pullback zum EMA · Keil-Flag-Pullback · Breakout-Pullback nach Flag-Ausbruch · High-1/Low-1 in der Spike-Phase (aber nicht direkt nach einem Climax) · Ausbruch über/unter altes Swing-Extrem bei sehr starkem Trend</td></tr>
      <tr><td>Limit-/Market-Orders (braucht mehr Erfahrung)</td><td>Direkt in den Spike hineinkaufen/-verkaufen (Markt, Bar-Schluss, oder Limit knapp unter/über Vorgänger) · An der Trendlinie/altem Swing-Punkt (Doppel-Boden/-Top-Flag) · An einem schwachen High-1/2-Signal nach starkem Reversal · Fixer Tick-/Punkte-Abstand vom letzten Extrem · Skaliertes Nachkaufen mit vorher festgelegter Positionsgröße</td></tr>
    </table>
  </div>

  <div class="quote"><b>Die wichtigste Verhaltensregel des ganzen Kapitels:</b> In einem Bull-Trend bist du NUR long oder flat. In einem Bear-Trend NUR short oder flat. Geh davon aus, dass du nicht zu der winzigen Minderheit gehörst, die dauerhaft profitabel gegen den Trend handeln kann — die meisten Trader, die das jahrelang glauben, verlieren genau deshalb kontinuierlich Geld.</div>

  <div class="card"><h3>Trading-Mathematik: Scalp vs. Swing</h3><ul>
    <li>Scalping (Ziel kleiner als Risiko) verlangt ca. 70 % Trefferquote — für die allermeisten Trader dauerhaft unrealistisch</li>
    <li>Swing-Trading (Ziel ≥ Risiko, ~60 % Zuversicht) ist der bessere Standardansatz für Einsteiger</li>
    <li><b>Faustregel:</b> keinen Teilgewinn realisieren, bevor der Kurs nicht mindestens das Doppelte des Anfangsrisikos gelaufen ist — sonst wird die Kalkulation über viele Trades hinweg negativ</li>
  </ul></div>

  <div class="card"><h3>Stop-Nachführung &amp; Skalieren in der Praxis</h3><ul>
    <li>Nach jedem neuen Hoch (Bull-Trend): Stop auf knapp unter das letzte höhere Tief nachziehen</li>
    <li>Testet der Kurs den Einstiegspreis erneut und macht dann ein neues Hoch: Stop spätestens jetzt auf Breakeven oder knapp unter diesen Retest ziehen</li>
    <li>Beim Nachkaufen in einen Spike hinein: Positionsgröße vorab so planen, dass das Gesamt-Dollar-Risiko konstant bleibt — sonst leicht in eine zu große Position mit zu weitem Stop hineinrutschen</li>
    <li>Praxis-Toleranz: in einem Markt mit ~10–15 Punkten Tagesrange gilt ein Pullback oft erst dann als Trendbruch-Warnsignal, wenn er 50–75 % der durchschnittlichen Tagesrange erreicht</li>
  </ul></div>

  <div class="card"><h3>Der klassische Anfängerfehler (und wie man ihn vermeidet)</h3><ul>
    <li>Jeden Reversal-Versuch in einem starken Bull-Trend als Short-Scalp handeln, aber den eigentlichen Pullback zum Kaufen auslassen, weil er "nicht stark genug aussieht"</li>
    <li>Das Bildschirm-Gefühl ("hier ist doch schon alles ausgereizt") ist keine Information — es entsteht rein daraus, dass der aktuellste Bar immer am Bildschirmrand sitzt</li>
    <li>Erfolgreiche Trader akzeptieren: jedes neue Hoch ist zunächst der Start einer weiteren Bull-Flag, bis der Markt wirklich eindeutig auf "Always-in Short" kippt</li>
  </ul></div>

  <div class="card"><h3>Kondensiertes Beispiel: ein kompletter Bull-Trend-Tag (GS-Aktie)</h3><ul>
    <li>Gap-up + starker Bull-Trend-Bar zur Eröffnung → früh als möglicher "Trend from the Open"-Tag erkennbar, kleine Erstposition trotz noch weitem Stop</li>
    <li>Serie von High-2-Pullbacks, Keil-/Dreiecks-Flags und Doppel-Böden liefert im Tagesverlauf ca. ein Dutzend plausible Nachkauf-Signale — man muss nicht alle nehmen, 1–3 gute reichen völlig</li>
    <li>Nach jedem neuen Hoch: Stop unter das jeweils letzte höhere Tief nachgezogen; Teilgewinne erst ab dem Doppelten des Anfangsrisikos realisiert</li>
    <li>Ein dritter, ungewöhnlich großer Bull-Bar nach mehreren Climax-Schüben in Folge markiert schließlich eine gute Stelle für Teilverkäufe — der Markt driftet danach in Richtung Trading Range, ohne je eindeutig auf "Always-in Short" zu kippen</li>
    <li>Ergebnis für einen typischen Swing-Trader in diesem Beispiel: mehrere hundert bis über 1.000 Dollar Gewinn auf eine überschaubare Positionsgröße — bei konsequenter Nutzung von nur 2–3 der zahlreichen Tages-Signale</li>
  </ul></div>

`;

  <div class="lead">Je mehr dieser Stärke-Merkmale gleichzeitig auftreten, desto konsequenter solltest du NUR noch Mit-Trend-Setups suchen — und jeden Gegentrend-Versuch nur noch als Steilvorlage für einen Mit-Trend-Einstieg lesen, genau dort, wo die Gegenseite gezwungen ausgestoppt wird.</div>

    <table>

      <tr><td>Gaps</td><td>Echte Lücken zwischen Bar-Körpern, Measuring Gaps und Micro Measuring Gaps als zusätzliche Stärkezeichen</td></tr>

      <tr><td>Linien-Verhalten</td><td>Kein nennenswertes Kanallinien-Überschießen; Korrekturen nach Trendlinienbrüchen verlaufen seitwärts statt gegentrend; gescheiterte Keile/Reversals häufen sich</td></tr>

      <tr><td>Reichweite</td><td>Trend durchbricht mehrere Widerstandszonen (EMA, alte Swings, Trendlinien) jeweils um viele Ticks, nicht nur knapp</td></tr>

    <li>Vom 1-Minuten-Chart rät Brooks in dieser Situation ab: er zeigt zusätzlich auch Gegentrend-Setups, was beim reinen Mit-Trend-Fokus nur Verwirrung und Stress erzeugt</li>
    <li>Für die meisten Trader gilt: in einem Runaway-Trend am besten strikt beim 5-Minuten-Chart bleiben; den 3-Minuten-Chart erst mit wachsender Erfahrung ergänzen</li>

  <div class="quote"><b>Der Lebenszyklus, gespiegelt:</b> Mit der Zeit werden die Pullbacks größer, die starke Seite beginnt an neuen Extremen eher Gewinne mitzunehmen als nachzukaufen, und die Gegenseite beginnt aktiv zu faden. Aus dem anfänglichen Spike wird ein Channel, aus dem Channel irgendwann eine Trading Range.</div>

  <div class="card"><h3>Beispiel-Walkthroughs</h3>

    <table>
      <tr><th style="width:20%">Phase</th><th>Charakter</th></tr>
      <tr><td><b>Spike</b></td><td>Ein oder mehrere Trend-Bars, kaum Overlap, spürbare Dringlichkeit — der Markt wird für die meisten eindeutig "Always-in". Bildet sich meist in der ersten Handelsstunde. Funktional identisch mit einem Ausbruchs-Gap</td></tr>
      <tr><td><b>Channel</b></td><td>Nach einem Pullback (1 bis viele Dutzend Bars) folgt die "Wall of Worry"-Phase: mehr Overlap, mehr Zweifel, ständiges Gefühl "das muss doch gleich enden" — und trotzdem geht es oft viel länger weiter als erwartet</td></tr>
    </table>
    <div class="drill-instruction" style="text-align:left;margin-top:8px;">Je stärker der Spike, desto wahrscheinlicher ein weit laufender Channel danach — und desto eher lässt sich daraus ein Measured-Move-Kursziel ableiten.</div>
  </div>

  <div class="quote"><b>Wie man den Channel handelt:</b> Wie eine schräge Trading Range — im Bull-Channel unter dem Vorgänger-Tief kaufen und einen Teil swingen; Shorts nur als Scalps oberhalb von Swing-Hochs. Ein Ausbruch MIT dem Trend aus dem Channel gelingt selten und scheitert, wenn er kommt, meist innerhalb von 5 Bars. Der eigentliche, erwartbare Ausbruch erfolgt fast immer GEGEN den bisherigen Trend — und genau darauf sollte man warten, statt ihn direkt zu handeln.</div>

  <div class="card"><h3>Das immer wiederkehrende Enddrehbuch</h3><ul>
    <li>Bricht der Channel schließlich gegen den Trend aus: NICHT auf den Ausbruch selbst einsteigen, sondern auf den anschließenden Pullback (höheres Tief bzw. tieferes Hoch) warten</li>
    <li>Der Markt korrigiert fast immer zurück zum ANFANG des Channels — das ist zugleich ein Test der ursprünglichen Spike-Lücke</li>
    <li>Dort bildet sich typischerweise ein Doppel-Boden (Bull-Fall) bzw. Doppel-Top (Bear-Fall) mit dem Tief/Hoch des Channel-Starts → das löst meist einen Bounce von mindestens ~25 % der vorherigen Bewegung aus (das dritte Bein einer sich neu formenden Trading Range)</li>
    <li>Nach diesem Bounce ist die Vorhersagekraft des Spike-and-Channel-Musters ausgeschöpft — jetzt nach neuen, unabhängigen Mustern suchen</li>
  </ul></div>

  <div class="quote"><b>Die "Crowded Trade"-Analogie (Aktienhändler-Jargon):</b> Am Ende eines Bull-Channels hat praktisch jeder, der kaufen wollte, schon gekauft — es ist niemand mehr übrig, der noch nachkaufen könnte. Genau das macht den anschließenden schnellen Rückfall zum Channel-Anfang so typisch: alle späten Käufer mit offenem Verlust drängen gleichzeitig zum Ausgang.</div>

  <div class="card"><h3>Variante: aufeinanderfolgende Climaxe statt eines ruhigen Channels</h3><ul>
    <li>Manchmal folgt auf den ersten Spike (nach kurzer Pause) direkt ein ZWEITER, ähnlich starker Spike — das übernimmt funktional die Rolle der "Channel"-Phase</li>
    <li>Grund für die meist größere Korrektur danach: nach zwei aufeinanderfolgenden Climaxen sind auf beiden Seiten die emotionalen/ungeduldigen Trader bereits vollständig verbraucht (schwache Longs raus, ungeduldige neue Shorts rein, bzw. gespiegelt) — es bleibt niemand mehr übrig, um die Gegenseite jeder neuen Order zu füllen, was eine 2-beinige, 10+ Bar lange Korrektur auslöst</li>
    <li>Selten gibt es sogar einen dritten Climax in Folge, bevor die komplexere Korrektur einsetzt</li>
  </ul></div>

  <div class="card"><h3>Kumulative Spikes ernst nehmen</h3><ul>
    <li>Mehrere kleinere Spikes gegen den Haupttrend innerhalb von 10–20 Bars zählen zusammen, auch wenn nur der letzte davon optisch dramatisch wirkt</li>
    <li>Manchmal ist tatsächlich der ZWEITE (unscheinbarere) Spike der eigentliche Wendepunkt, und die Rallye zum neuen Extrem danach war bloß ein Pullback von diesem — nicht automatisch der offensichtlichste, größte Bar als "den" Auslöser werten</li>
  </ul></div>

  <div class="card"><h3>Risikohinweis beim Skalieren gegen einen schwachen Channel</h3><ul>
    <li>Je mehr Overlap, Gegentrend-Bars und mehrbarige Pullbacks ein Channel zeigt, desto aggressiver dürfen institutionelle Gegentrend-Käufer/-Verkäufer werden</li>
    <li>Für die meisten Trader gilt trotzdem: Gegenposition-Aufbau in der zweiten Tageshälfte vermeiden — sonst bleibt bei Fehleinschätzung keine Zeit mehr, verlustfrei herauszukommen</li>
  </ul></div>

  <div class="card"><h3>Beispiel-Walkthrough</h3><ul>
    <li>Ein Tag beginnt mit einem Ausverkauf, der in einen kräftigen Bull-Reversal-Bar kippt — erst nach einem zweiten Bestätigungs-Bar glauben genug Trader an "Always-in Long"</li>
    <li>Der folgende Channel bildet einen Keil mit drei Aufwärtsschüben — endet exakt dort, wo die Trendkanallinie überschossen wird, mit einem starken Bear-Reversal-Bar als Short-Signal</li>
    <li>Die Korrektur danach testet zweibeinig den Start des Channels (die alte Spike-Lücke) und bildet dort einen Doppel-Boden — von dort aus startet die nächste Aufwärtsbewegung fast exakt bis zu einem Measured-Move-Kursziel</li>
    <li>Mehrere kleinere Bear-Spikes VOR dem eigentlichen großen Reversal waren bereits kumulative Warnzeichen für die beginnende Zweiseitigkeit — nicht nur der letzte, größte Spike zählte</li>
  </ul></div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 21 (inkl. Teil-IV-Einleitung) aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

CONTENT['b1-ch22'] = `
  <div class="lead">Auf dem Tages-Chart sieht so ein Tag wie ein sauberer Trendtag aus — öffnet an einem Ende, schließt am anderen. Auf dem Intraday-Chart ist es in Wahrheit eine Kette aus mehreren Trading Ranges, getrennt durch kurze Ausbrüche. Mit rund doppelt so häufigem Vorkommen wie ein reiner Spike-and-Channel-Tag ist dies der häufigste "Trend"-Typ überhaupt.</div>

  <div class="card"><h3>Früherkennung: die Eröffnungsrange als Hinweis</h3><ul>
    <li>Ist die Range der ersten 1–2 Stunden nur etwa ⅓ bis ½ der durchschnittlichen Tagesrange, rechne mit einem Ausbruch und einer ungefähren Verdopplung der bisherigen Range</li>
    <li>Selbst innerhalb einer scheinbaren Trading Range können bereits leicht steigende (oder fallende) Swing-Hochs UND -Tiefs verraten, dass der Markt heimlich schon einen Trend bildet — ein feiner Hinweis auf den bevorstehenden Ausbruch</li>
  </ul></div>

  <div class="card"><h3>Unterscheidung: Spike-and-Channel vs. Trending Trading Range</h3>
    <table>
      <tr><th style="width:30%">Merkmal</th><th>Spike-and-Channel</th><th>Trending Trading Range</th></tr>
      <tr><td>Start</td><td>Oft schon im 1. Bar, großes Gap</td><td>Ausbruch aus einer Range, meist noch innerhalb der gestrigen Range</td></tr>
      <tr><td>Spike-Bars</td><td>3+ große Bars, kaum Overlap</td><td>Nur 1–3 Bars, mehr Dochte/Overlap</td></tr>
      <tr><td>Handelsweise</td><td>Fast nur Mit-Trend, swingen</td><td>Beide Richtungen, mehr scalpen</td></tr>
    </table>
  </div>

  <div class="quote"><b>Die wichtigste Beobachtung des Kapitels:</b> Die meisten "Reversal Days" (Tage, die scheinbar in die eine Richtung eröffnen und komplett in die andere schließen) beginnen als ganz gewöhnlicher Trending-Trading-Range-Tag — der spätere Rückfall durch mindestens eine der Ranges hindurch ist KEIN Zufall, sondern die erwartbare Fortsetzung des Musters selbst.</div>

  <div class="card"><h3>Warum der Rückfall so zuverlässig kommt</h3><ul>
    <li>Jede Trading Range ist eine Zone, in der sich beide Seiten wohlfühlen — das wirkt wie ein Magnet auf spätere Ausbrüche</li>
    <li>Nach Erreichen eines ungefähren Measured-Move-Ziels wechseln erfahrene Trader bewusst von Trend-Stil (swingen) zu Range-Stil (Gewinne eher bei Stärke statt bei Schwäche realisieren, Stop nicht mehr stur unter das letzte Swing-Tief legen)</li>
    <li>Fortgeschrittene faden sogar gezielt einen großen Trend-Bar in der Nähe des Measured-Move-Ziels — in der Annahme, dass er ein erschöpfender Climax ist, gefolgt von einem Rücktest bis in die ursprüngliche Ausbruchs-Lücke</li>
  </ul></div>

  <div class="card"><h3>Zwei praktische Nuancen</h3><ul>
    <li>Bricht der Rückfall NICHT wieder in die alte Range zurück, sondern bleibt knapp außerhalb: das ist ein Stärkezeichen für die neue Richtung</li>
    <li>Bricht der Kurs stattdessen ganz durch die alte Range hindurch: der Tag entwickelt sich zu einem echten Reversal Day</li>
    <li>In etwa einem Drittel der Fälle bricht eine kleine Anfangs-Range einfach auf BEIDEN Seiten leicht aus (erst hoch, dann tief oder umgekehrt) und bleibt insgesamt ein ruhiger, reiner Trading-Range-Tag ohne klaren Trend</li>
  </ul></div>

  <div class="quote"><b>Randnotiz zu ungewöhnlich ruhigen Tagen:</b> Bleibt die Tagesrange bis in die letzte Stunde bei nur einem Bruchteil des Jahresdurchschnitts, heißt das nicht "heute passiert nichts" — in rund 90 % solcher Fälle kommt es trotzdem noch spät am Tag zu einem handelbaren Ausbruch, auch wenn dann keine Zeit mehr für eine zweite Range bleibt.</div>

  <div class="footer-note">Eigenständige Zusammenfassung von Kapitel 22 aus „Trading Price Action Trends" (Al Brooks) — in eigenen Worten, zu Lernzwecken.</div>
`;

  <div class="lead">Der "Trend from the Open" ist der stärkste Trendtyp überhaupt — das Extrem des Tages bildet sich schon in den ersten Bars. Seine reinste Form, der "Small Pullback Trend Day", ist zugleich der am schwersten zu handelnde, weil er sich die ganze Zeit falsch/schwach anfühlt.</div>

    <li>Große Gaps führen oft zu "Trend from the Open" — aber nicht zwingend in Gap-Richtung: bei einem Gap-up wird der Tag ca. 60 % der Fälle ein Bull-Trend, aber immerhin 40 % ein Bear-Trend (gespiegelt bei Gap-down)</li>

  <div class="quote"><b>Der "Small Pullback Trend Day" — die stärkste Form von allen:</b> Pullbacks bleiben den ganzen Tag winzig (oft nur 10–30 % der Tagesrange). Meist erscheint irgendwann nach 11 Uhr EIN größerer Rücksetzer (ca. 150–200 % der bisherigen Pullback-Größe), oft eingeleitet durch ein bis zwei ungewöhnlich starke Trend-Bars, die tatsächlich eher erschöpfende Climax-Bars sind als eine neue Beschleunigung. Danach setzt sich der Trend meist bis zum Handelsende fort.</div>

  <div class="card"><h3>Das zentrale Paradox dieses Musters</h3><ul>
    <li>Erfahrenen Tradern gelingen die Mit-Trend-Swing-Einstiege hier zu 70 % oder mehr — Einsteigern sehen genau dieselben Setups nach 50 % oder weniger Erfolgschance aus</li>
    <li>Grund: viele Gegentrend-Bars und -Spikes tauchen den ganzen Tag auf und verleiten dazu, Reversals zu suchen, statt die (schwach aussehenden) Mit-Trend-Pullbacks zu kaufen/verkaufen</li>
    <li>Jede "hässliche" Bull-Flag hält trotzdem, jedes "gut aussehende" Short-Setup danach scheitert — genau das ist die Definition dieses Musters</li>
  </ul></div>

  <div class="card"><h3>Praktische Stop-Regeln für diesen Trendtyp</h3><ul>

  <div class="quote"><b>Zu News-Reports (z. B. 7-Uhr-Daten oder FOMC):</b> Computer verarbeiten solche Meldungen in Sekundenbruchteilen — als Mensch hat man dort keinen Vorteil. Nie auf den ersten Ausschlag WÄHREND des Bars reagieren; ein scheinbar starker Bear-Bar in Minute 4 kann bis zum Schluss noch zum Bull-Reversal-Bar kippen. Immer den vollständigen Bar-Schluss abwarten, dann die klare Always-in-Richtung oder ein sauberes Reversal-Setup handeln.</div>

let currentChapter = null;

function loadProgress(){
  try { return JSON.parse(localStorage.getItem('brooks-progress') || '{}'); }
  catch(e){ return {}; }
}
function saveProgress(p){
  try { localStorage.setItem('brooks-progress', JSON.stringify(p)); } catch(e){}
}
let progress = loadProgress();

function totalChaptersCount(){ return Object.keys(CHAPTERS).length; }
function doneCount(){ return Object.keys(progress).filter(k => progress[k]).length; }

function updateProgressBar(){
  const total = totalChaptersCount();
  const done = doneCount();
  document.getElementById('progress-text').textContent = done + ' / ' + total;
  document.getElementById('progress-fill').style.width = (total ? (done/total*100) : 0) + '%';
}

function renderNav(){
  const root = document.getElementById('nav-root');
  root.innerHTML = '';
  DATA.forEach(book => {
    const bookDiv = document.createElement('div');
    bookDiv.className = 'nav-book';
    const title = document.createElement('div');
    title.className = 'nav-book-title';
    title.innerHTML = '<span class="chev">▾</span><span>' + book.title + '</span>';
    title.onclick = () => { bookDiv.classList.toggle('collapsed'); };
    bookDiv.appendChild(title);
    book.parts.forEach(part => {
      const partDiv = document.createElement('div');
      partDiv.className = 'nav-part';
      const pt = document.createElement('div');
      pt.className = 'nav-part-title';
      pt.textContent = part.title;
      partDiv.appendChild(pt);
      part.chapters.forEach(ch => {
        const cdiv = document.createElement('div');
        cdiv.className = 'nav-chapter' + (ch.status === 'done' ? ' done' : '') + (progress[ch.id] ? ' done' : '');
        cdiv.id = 'nav-' + ch.id;
        cdiv.innerHTML = '<span class="dot"></span><span>' + ch.title + '</span>' +
          (ch.status === 'pending' ? '<span class="status-pending">bald</span>' : '');
        cdiv.onclick = () => openChapter(ch.id);
        partDiv.appendChild(cdiv);
      });
      bookDiv.appendChild(partDiv);
    });
    root.appendChild(bookDiv);
  });
  updateProgressBar();
}

function markActive(id, drillId){
  document.querySelectorAll('.nav-chapter').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-glossary').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-drill').forEach(el => el.classList.remove('active'));
  if (drillId){
    const el = document.getElementById('nav-drill-' + drillId);
    if (el) el.classList.add('active');
  } else if (id){
    const el = document.getElementById('nav-' + id);
    if (el) el.classList.add('active');
  } else {
    document.getElementById('nav-glossary').classList.add('active');
  }
}

function openChapter(id){
  currentView = 'chapter';
  currentChapter = id;
  markActive(id);
  closeSidebarMobile();
  const ch = CHAPTERS[id];
  const content = document.getElementById('content');
  let html = '<div class="crumb">' + ch.bookTitle + ' · ' + ch.partTitle + '</div>';
  html += '<div class="page-title">' + ch.title + '</div>';

  if (ch.status === 'done' && CONTENT[id]){
    html += CONTENT[id];
    const checked = progress[id] ? 'checked' : '';
    html += '<div class="mark-row"><label><input type="checkbox" id="mark-done" ' + checked + ' onchange="toggleDone(\'' + id + '\')"> Als gelesen markieren</label></div>';
    if (QUIZZES[id]) html += renderQuizHTML(id);
  } else {
    html += '<div class="pending-box"><div class="big">🛠️</div><div>Dieses Kapitel ist noch nicht zusammengefasst.<br>Lade das passende Buch/EPUB hoch, dann ergänze ich es hier im gleichen Stil.</div></div>';
  }
  content.innerHTML = html;
  window.scrollTo(0,0);
  if (QUIZZES[id]) wireQuiz(id);
}

function toggleDone(id){
  progress[id] = document.getElementById('mark-done').checked;
  saveProgress(progress);
  renderNav();
  markActive(id);
}

function renderQuizHTML(id){
  const items = QUIZZES[id];
  let html = '<div class="quiz"><h3>Verständnis-Quiz</h3>';
  items.forEach((it, qi) => {
    html += '<div class="qitem" data-qi="' + qi + '"><div class="qtext">' + (qi+1) + '. ' + it.q + '</div>';
    it.opts.forEach((opt, oi) => {
      html += '<div class="qopt" data-oi="' + oi + '">' + opt + '</div>';
    });
    html += '</div>';
  });
  html += '<button class="quiz-btn" onclick="gradeQuiz(\'' + id + '\')">Auswerten</button><div class="quiz-score" id="quiz-score-' + id + '"></div></div>';
  return html;
}

function wireQuiz(id){
  document.querySelectorAll('.qitem').forEach(item => {
    const qi = item.getAttribute('data-qi');
    item.querySelectorAll('.qopt').forEach(opt => {
      opt.onclick = () => {
        item.querySelectorAll('.qopt').forEach(o => o.classList.remove('picked'));
        opt.classList.add('picked');
        item.setAttribute('data-picked', opt.getAttribute('data-oi'));
      };
    });
  });
}

function gradeQuiz(id){
  const items = QUIZZES[id];
  let correct = 0;
  document.querySelectorAll('.qitem').forEach(item => {
    const qi = parseInt(item.getAttribute('data-qi'));
    const picked = item.getAttribute('data-picked');
    const correctIdx = items[qi].correct;
    item.querySelectorAll('.qopt').forEach(opt => {
      const oi = parseInt(opt.getAttribute('data-oi'));
      if (oi === correctIdx) opt.classList.add('correct');
      else if (String(oi) === picked) opt.classList.add('wrong');
    });
    if (picked !== null && parseInt(picked) === correctIdx) correct++;
  });
  document.getElementById('quiz-score-' + id).textContent = 'Ergebnis: ' + correct + ' / ' + items.length + ' richtig.';
}

function showGlossary(){
  currentView = 'glossary';
  markActive(null);
  closeSidebarMobile();
  const content = document.getElementById('content');
  let html = '<div class="crumb">Nachschlagewerk</div><div class="page-title">Glossar &amp; Suche</div>';
  html += '<div class="lead">Fachbegriffe aus der Trilogie, in eigenen Worten erklärt. Wächst mit jedem zusammengefassten Kapitel weiter.</div>';
  html += '<div class="search-box"><input id="glossary-search" type="text" placeholder="Begriff suchen… z. B. Doji, High 2, Pullback" oninput="filterGlossary()"></div>';
  html += '<div class="glossary-count" id="glossary-count"></div>';
  html += '<div id="glossary-list"></div>';
  content.innerHTML = html;
  renderGlossaryList(GLOSSARY);
  document.getElementById('glossary-search').focus();
}

function renderGlossaryList(items){
  const list = document.getElementById('glossary-list');
  document.getElementById('glossary-count').textContent = items.length + ' von ' + GLOSSARY.length + ' Begriffen';
  list.innerHTML = items.map(([term, def]) =>
    '<div class="gterm"><b>' + term + '</b><p>' + def + '</p></div>'
  ).join('');
}

function filterGlossary(){
  const q = document.getElementById('glossary-search').value.toLowerCase().trim();
  if (!q){ renderGlossaryList(GLOSSARY); return; }
  const filtered = GLOSSARY.filter(([term, def]) => term.toLowerCase().includes(q) || def.toLowerCase().includes(q));
  renderGlossaryList(filtered);
}
